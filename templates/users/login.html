{% extends 'base.html' %}
{% block title %}Login — Aziza{% endblock %}
{% block content %}

<section class="section">
  <div class="container container-xs">
    <div class="auth-card">
      <h1 class="auth-title">Welcome Back 👋</h1>
      <p class="auth-sub">Login to your Aziza account</p>
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-input" placeholder="Your username" required autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-input" placeholder="Your password" required>
        </div>
        {% if form.errors %}
          <p class="form-error">Invalid username or password.</p>
        {% endif %}
        <button type="submit" class="btn-primary btn-large btn-full">Login →</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
  </div>
</section>

{% endblock %}
